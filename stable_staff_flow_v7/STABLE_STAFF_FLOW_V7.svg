<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>

    <filter id="card-shadow" x="-4%" y="-3%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- PURE WHITE BACKGROUND -->
  <rect width="1400" height="500" fill="#ffffff"/>

  <!-- TOP AUTHENTICATION FLOW (Dashboard centered at x=700) -->
  <g id="auth-flow">
    <!-- Node 1: Stable Staff Entry Card -->
    <g id="auth-node-1" filter="url(#card-shadow)">
      <rect x="25" y="36" width="130" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
      <g transform="translate(75, 46)">
        <circle cx="15" cy="11" r="8" fill="#15803d"/>
        <path d="M 5 30 C 5 22, 25 22, 25 30 Z" fill="#15803d"/>
      </g>
      <text x="90" y="101" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">Stable staff</text>
    </g>

    <!-- Connector: Node 1 -> Node 2 -->
    <line x1="155" y1="77" x2="205" y2="77" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

    <!-- Node 2: Credentials Input Card -->
    <g id="auth-node-2" filter="url(#card-shadow)">
      <rect x="205" y="36" width="160" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
      <g transform="translate(275, 45)">
        <rect x="5" y="10" width="18" height="14" rx="3" fill="#15803d"/>
        <path d="M 9 10 V 6 A 5 5 0 0 1 19 6 V 10" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="14" cy="17" r="2" fill="#ffffff"/>
      </g>
      <text x="285" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Enter username</text>
      <text x="285" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">and password</text>
    </g>

    <!-- Connector: Node 2 -> Decision Diamond -->
    <line x1="365" y1="77" x2="415" y2="77" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

    <!-- Node 3: Decision Diamond -->
    <g id="auth-diamond">
      <polygon points="485,36 555,77 485,118 415,77" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
      <text x="485" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Valid login</text>
      <text x="485" y="91" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">with</text>
    </g>

    <!-- Branch: Decision -> NO (Access Denied) -->
    <line x1="485" y1="118" x2="485" y2="152" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
    <text x="497" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">NO</text>

    <!-- Error Card: Access Denied -->
    <g id="auth-denied">
      <rect x="405" y="152" width="160" height="48" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
      <text x="485" y="171" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Access denied</text>
      <text x="485" y="187" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">Check login details</text>
    </g>

    <!-- Branch: Decision -> YES (Dashboard) -->
    <line x1="555" y1="77" x2="605" y2="77" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <text x="580" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d">yes</text>

    <!-- Node 4: Admin / Staff Dashboard Card (Centered at x=700) -->
    <g id="auth-dashboard" filter="url(#card-shadow)">
      <rect x="605" y="36" width="190" height="82" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
      <g transform="translate(686, 47)">
        <circle cx="14" cy="14" r="13" fill="#15803d"/>
        <path d="M 9 14 L 13 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="700" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">Open the staff</text>
      <text x="700" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">dashboard</text>
    </g>

    <!-- Connector: Dashboard -> Logout -->
    <line x1="795" y1="77" x2="865" y2="77" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-slate)"/>
    <text x="830" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Session end</text>

    <!-- Node 5: Logout Card -->
    <g id="auth-logout" filter="url(#card-shadow)">
      <rect x="865" y="36" width="160" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
      <g transform="translate(931, 45)">
        <rect x="5" y="10" width="18" height="14" rx="3" fill="#15803d"/>
        <path d="M 9 10 V 6 A 5 5 0 0 1 19 6 V 10" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="14" cy="17" r="2" fill="#ffffff"/>
      </g>
      <text x="945" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Log out</text>
      <text x="945" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Revoke the session</text>
    </g>
  </g>

  <!-- BRANCHING BUS CONNECTOR -->
  <g id="branching-bus">
    <!-- Vertical stem from Dashboard bottom (x = 700) -->
    <line x1="700" y1="118" x2="700" y2="220" stroke="#334155" stroke-width="1.8"/>

    <!-- Horizontal distribution bar spanning all 6 module centers (150 to 1250) -->
    <line x1="150" y1="220" x2="1250" y2="220" stroke="#334155" stroke-width="1.8"/>

    <!-- 6 Vertical drop lines entering functional cards -->
    <line x1="150" y1="220" x2="150" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <line x1="370" y1="220" x2="370" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <line x1="590" y1="220" x2="590" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <line x1="810" y1="220" x2="810" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <line x1="1030" y1="220" x2="1030" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
    <line x1="1250" y1="220" x2="1250" y2="255" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- SIX FUNCTIONAL CARDS (Compact width 200, improved height 205) -->
  <!-- Card 1: Daily Tasks -->
  <g id="card-1" filter="url(#card-shadow)">
    <rect x="50" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="150" cy="314" r="34" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g transform="translate(132, 295)">
      <rect x="4" y="6" width="28" height="30" rx="3" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <path d="M 12 6 V 4 A 2 2 0 0 1 24 4 V 6" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <circle cx="18" cy="4" r="1.5" fill="#2563eb"/>
      <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="11" y1="25" x2="25" y2="25" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="11" y1="30" x2="21" y2="30" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="150" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Daily</text>
    <text x="150" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Tasks</text>
  </g>

  <!-- Card 2: Training Preparation -->
  <g id="card-2" filter="url(#card-shadow)">
    <rect x="270" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="370" cy="314" r="34" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(352, 295)">
      <rect x="4" y="6" width="28" height="28" rx="3" fill="none" stroke="#4f46e5" stroke-width="2.2"/>
      <line x1="4" y1="13" x2="32" y2="13" stroke="#4f46e5" stroke-width="2.2"/>
      <line x1="11" y1="3" x2="11" y2="7" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="25" y1="3" x2="25" y2="7" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="18" cy="22" r="5.5" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <polyline points="18,19 18,22 21,22" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="370" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Training</text>
    <text x="370" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Preparation</text>
  </g>

  <!-- Card 3: Stable & Horse Activities -->
  <g id="card-3" filter="url(#card-shadow)">
    <rect x="490" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="590" cy="314" r="34" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <g transform="translate(572, 295)">
      <path d="M 4 16 L 18 4 L 32 16 V 32 H 4 Z" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 12 32 V 19 H 24 V 32" fill="none" stroke="#0d9488" stroke-width="2.2"/>
      <line x1="18" y1="4" x2="18" y2="11" stroke="#0d9488" stroke-width="2.2"/>
    </g>
    <text x="590" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Stable &amp; Horse</text>
    <text x="590" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Activities</text>
  </g>

  <!-- Card 4: Feeding Management -->
  <g id="card-4" filter="url(#card-shadow)">
    <rect x="710" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="810" cy="314" r="34" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <g transform="translate(792, 295)">
      <path d="M 5 16 Q 18 33 31 16 Z" fill="none" stroke="#d97706" stroke-width="2.2"/>
      <line x1="3" y1="16" x2="33" y2="16" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 13 8 Q 18 4 23 8" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
      <circle cx="18" cy="11.5" r="1.8" fill="#d97706"/>
    </g>
    <text x="810" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Feeding</text>
    <text x="810" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Management</text>
  </g>

  <!-- Card 5: Incident Reporting -->
  <g id="card-5" filter="url(#card-shadow)">
    <rect x="930" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="1030" cy="314" r="34" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <g transform="translate(1012, 295)">
      <polygon points="18,4 34,32 2,32" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round"/>
      <line x1="18" y1="13" x2="18" y2="21" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="18" cy="26.5" r="1.8" fill="#dc2626"/>
    </g>
    <text x="1030" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Incident</text>
    <text x="1030" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Reporting</text>
  </g>

  <!-- Card 6: Inventory & Supplies -->
  <g id="card-6" filter="url(#card-shadow)">
    <rect x="1150" y="255" width="200" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="1250" cy="314" r="34" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <g transform="translate(1232, 295)">
      <polygon points="18,3 33,11 18,19 3,11" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="3,11 18,19 18,34 3,26" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="33,11 18,19 18,34 33,26" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
      <line x1="18" y1="19" x2="18" y2="34" stroke="#059669" stroke-width="2"/>
    </g>
    <text x="1250" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Inventory &amp;</text>
    <text x="1250" y="409" font-family="'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">Supplies</text>
  </g>

</svg>